packages:
  - "website"
  - "sdk/*"
  # plugin-claude is a standalone npm package (its own node_modules / lockfile),
  # not part of the pnpm workspace — keep it out of frozen install + -r builds.
  - "!sdk/plugin-claude"
  # plugin-tinyplace is the unified plugin (own node_modules / lockfile) — same
  # standalone treatment: keep it out of the frozen install + recursive builds.
  - "!sdk/plugin-tinyplace"
